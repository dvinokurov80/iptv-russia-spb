name: Update IPTV playlist

concurrency:
  group: update-iptv-playlist
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths-ignore:
      - "playlist.m3u"
      - "epg.xml.gz"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python build_playlist.py

      - name: Validate playlist
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          data = Path("playlist.m3u").read_text(encoding="utf-8")
          assert data.startswith("#EXTM3U"), "Missing M3U header"
          entries = re.findall(r"^#EXTINF:", data, re.M)
          urls = [line for line in data.splitlines() if line.startswith(("http://", "https://"))]
          assert len(entries) == len(urls), f"EXTINF/URL mismatch: {len(entries)} vs {len(urls)}"
          assert 'group-title="' in data, "No category tags found"
          assert 'group-title="Санкт-Петербург и Ленобласть"' not in data, "Separate regional category must not exist"
          assert 'group-title="Музыка"' not in data, "Music category must not exist"
          titles = [line.split(",", 1)[1].strip() for line in data.splitlines() if line.startswith("#EXTINF:") and "," in line]
          assert not any(re.search(r"(^|[^а-яa-z])(?:радио|radio)([^а-яa-z]|$)|\bFM\b", title, re.I) for title in titles), "Radio channel leaked into playlist"
          assert re.search(r"^#EXTINF:.*(?:Первый канал|Channel One)", data, re.I | re.M), "Первый канал is missing"
          assert not re.search(r'tvg-id="[^"]+@', data), "Unnormalized EPG channel ID"

          main_entries = re.findall(r'^#EXTINF:.*?group-title="([^"]+)"', data, re.M)
          main_groups = [group for group in main_entries if group != "Избранное"]
          assert len(main_groups) >= 100, f"Only {len(main_groups)} main entries"
          ids = re.findall(r'^#EXTINF:.*?tvg-id="([^"]+)"', data, re.M)
          assert all(channel_id.strip() for channel_id in ids), "Empty EPG ID attribute"
          print(f"Validated {len(main_groups)} main channels and {len(entries)} total playlist entries; {len(ids)} have EPG IDs")
          PY

      - name: Validate merged EPG
        run: |
          python - <<'PY'
          from pathlib import Path
          import gzip
          import re
          import xml.etree.ElementTree as ET
          from datetime import datetime

          path = Path("epg.xml.gz")
          assert path.exists() and path.stat().st_size > 0, "Merged EPG file is missing or empty"
          root = ET.fromstring(gzip.decompress(path.read_bytes()))
          channels = {node.get("id") for node in root.findall("channel")}
          programmes = root.findall("programme")
          assert channels and programmes, "Merged EPG has no channels or programmes"
          offsets = set()
          intervals = {}
          for node in programmes:
              channel_id = node.get("channel")
              assert channel_id in channels, f"Programme references missing channel {channel_id}"
              for key in ("start", "stop"):
                  value = node.get(key, "")
                  match = re.search(r"([+-]\d{4})$", value)
                  assert match, f"Timestamp has no explicit offset: {value}"
                  offsets.add(match.group(1))
              start = datetime.strptime(node.get("start"), "%Y%m%d%H%M%S %z")
              stop = datetime.strptime(node.get("stop"), "%Y%m%d%H%M%S %z")
              assert stop > start, "Programme has non-positive duration"
              intervals.setdefault(channel_id, []).append((start, stop))
          assert offsets == {"+0300"}, f"EPG is not consistently Moscow time: {sorted(offsets)}"
          for channel_id, items in intervals.items():
              items.sort()
              for previous, current in zip(items, items[1:]):
                  assert previous[1] <= current[0], f"Overlapping programmes for {channel_id}"
          print(f"Validated merged EPG: {len(channels)} channels, {len(programmes)} programmes, Moscow UTC+03:00, no overlaps")
          PY

      - name: Commit updated playlist
        run: |
          git add playlist.m3u epg.xml.gz
          if git diff --cached --quiet; then
            echo "Playlist has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update IPTV playlist"
          git pull --rebase -X theirs origin main
          git push
