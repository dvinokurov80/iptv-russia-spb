name: Update IPTV playlist

concurrency:
  group: update-iptv-playlist
  cancel-in-progress: false

on:
  push:
    branches: [main]
    paths-ignore:
      - "playlist.m3u"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python build_playlist.py

      - name: Validate playlist
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          data = Path("playlist.m3u").read_text(encoding="utf-8")
          assert data.startswith("#EXTM3U"), "Missing M3U header"
          entries = re.findall(r"^#EXTINF:", data, re.M)
          urls = [line for line in data.splitlines() if line.startswith(("http://", "https://"))]
          assert len(entries) == len(urls), f"EXTINF/URL mismatch: {len(entries)} vs {len(urls)}"
          assert 'group-title="' in data, "No category tags found"
          assert not re.search(r'tvg-id="[^"]+@', data), "Unnormalized EPG channel ID"

          main_entries = re.findall(r'^#EXTINF:.*?tvg-id="([^"]+)".*?group-title="([^"]+)"', data, re.M)
          main_ids = [channel_id for channel_id, group in main_entries if group != "Избранное"]
          assert len(main_ids) >= 200, f"Only {len(main_ids)} unique main entries"
          assert len(main_ids) == len(set(main_ids)), "Duplicate channel IDs outside Favourites"
          print(f"Validated {len(main_ids)} unique channels and {len(entries)} total playlist entries")
          PY

      - name: Commit updated playlist
        run: |
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "Playlist has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update IPTV playlist"
          git pull --rebase -X theirs origin main
          git push
