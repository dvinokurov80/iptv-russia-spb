name: Update IPTV playlist

on:
  push:
    branches: [main]
    paths-ignore:
      - "playlist.m3u"
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist
        run: python build_playlist.py

      - name: Validate playlist
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path("playlist.m3u")
          data = p.read_text(encoding="utf-8")
          assert data.startswith("#EXTM3U"), "Missing M3U header"
          entries = re.findall(r"^#EXTINF:", data, re.M)
          urls = [line for line in data.splitlines() if line.startswith(("http://", "https://"))]
          assert entries, "Playlist contains no channels"
          assert len(entries) == len(urls), f"EXTINF/URL mismatch: {len(entries)} vs {len(urls)}"
          assert 'group-title="' in data, "No category tags found"
          print(f"Validated {len(entries)} channel entries")
          PY

      - name: Commit updated playlist
        run: |
          git add playlist.m3u
          if git diff --cached --quiet; then
            echo "Playlist has not changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update IPTV playlist"
          git push
